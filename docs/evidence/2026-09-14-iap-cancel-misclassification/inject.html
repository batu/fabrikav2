<script>
(function(){
  var RELAY='http://192.168.1.98:5731';
  function post(p,b){try{var x=new XMLHttpRequest();x.open('POST',RELAY+p,true);x.setRequestHeader('Content-Type','text/plain');x.send(b);}catch(e){}}
  function ser(a){return Array.prototype.map.call(a,function(v){try{return typeof v==='string'?v:JSON.stringify(v);}catch(e){return String(v);}}).join(' ');}
  ['log','info','warn','error','debug'].forEach(function(k){var o=console[k].bind(console);console[k]=function(){o.apply(console,arguments);post('/log',k+' '+ser(arguments));};});
  window.addEventListener('error',function(e){post('/log','window.error '+e.message+' '+(e.filename||'')+':'+(e.lineno||''));});
  window.addEventListener('unhandledrejection',function(e){post('/log','unhandledrejection '+(e.reason&&e.reason.message||String(e.reason)));});
  window.__relayPost=post;
  setInterval(function(){try{var x=new XMLHttpRequest();x.open('GET',RELAY+'/next',true);x.onload=function(){if(x.status===200&&x.responseText){var r;try{r=eval(x.responseText);}catch(e){r='EVAL ERROR '+e.message;}Promise.resolve(r).then(function(v){post('/result',typeof v==='string'?v:JSON.stringify(v));},function(e){post('/result','REJECT '+(e&&e.message||e));});}};x.send();}catch(e){}},1500);
  post('/log','relay attached '+location.href);
})();
</script>
