name: CI

on:
  push:
    branches: [main]
  pull_request:

# Matrix is DISCOVERED from npm workspaces, never hardcoded — every current and
# future packages/* and games/* workspace is covered automatically. v1's CI
# covered only 2 of 5 games (docs/research/01-v1-goals-and-docs.md §2), which is
# exactly the drift this discovery step exists to prevent.
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.set.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm query .workspace reads node_modules metadata; on a bare checkout it
      # returns [] and the empty-matrix guard below would skip `check` entirely,
      # silently recreating v1's zero-coverage failure. npm ci first.
      - run: npm ci
      - id: set
        name: Discover workspaces
        run: |
          list="$(npm query .workspace --json | node -e 'const w=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(JSON.stringify(w.map(p=>p.name)))')"
          echo "Discovered workspaces: $list"
          echo "workspaces=$list" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    # Empty repo (no workspaces yet) → skip cleanly instead of erroring on an
    # empty matrix.
    if: ${{ needs.discover.outputs.workspaces != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}
    name: check (${{ matrix.workspace }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w "${{ matrix.workspace }}" --if-present
      - run: npm run lint -w "${{ matrix.workspace }}" --if-present
      - run: npm run test:unit -w "${{ matrix.workspace }}" --if-present

  # Guardrail linters (tools/audit). Matrix-independent: runs once over the whole
  # repo, not per-workspace, since the checks are cross-workspace (duplication
  # compares games against packages; phantom-dep scans every workspace's imports).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  # FTD editor owns Python contracts plus generated OpenAPI/TypeScript/public
  # schema. Keep this aggregate explicit: workspace discovery only sees npm.
  ftd-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run editor:ci -w @fabrikav2/ftd-level-editor

  # The generic editor owns a separate Python backend and browser fixture suite;
  # npm's optional workspace unit script does not execute either of them.
  level-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Golden cutout classification reads rejected sprites at this manifest
      # revision. Fetch that immutable fixture only, not the entire history.
      - run: git fetch --no-tags --depth=1 origin 8a80bcfe2789015a330fd9e168e021f1b1d612f7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run editor2:ci -w @fabrikav2/level-editor-tool
        env:
          EDITOR2_VERIFY_DIR: ${{ runner.temp }}/editor2-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor2-verification
          path: |
            ${{ runner.temp }}/editor2-verification/*.log
            ${{ runner.temp }}/editor2-verification/*.xml
            ${{ runner.temp }}/editor2-verification/results.json
            ${{ runner.temp }}/editor2-verification/requirements.txt
            ${{ runner.temp }}/editor2-verification/screenshots/
