experiments:
  - iteration: 1
    batch: 1
    hypothesis: Fully transparent Modeler parts still submit draw calls and triangles; hiding those objects preserves pixels while reducing late-game GPU work.
    category: rendering
    outcome: kept
    changes:
      - file: games/marble_run/src/three/ModelerSpec.ts
        summary: Mark zero-opacity transparent Modeler meshes invisible at construction.
      - file: games/marble_run/src/three/ModelerSpec.test.ts
        summary: Lock the zero-opacity culling invariant.
    gates:
      levels_profiled: 6
      draw_calls: 643
      triangles: 118466
      frames_min: 717
    gates_passed: true
    diagnostics:
      p95_ms: 19
      worst_ms: 22
